services:
  mongo:
    image: mongo:8
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - planner-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  planner-mongo:
